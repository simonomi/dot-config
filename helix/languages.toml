# https://github.com/helix-editor/helix/blob/master/languages.toml

[[language]]
name = "yaml"
auto-format = false

[[language]]
name = "xml"
indent = { tab-width = 4, unit = "\t" }

[language-server.codebook]
command = "codebook-lsp"
args = ["serve"]

[[language]]
name = "lua"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "kdl"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "usd"
scope = "source.usda"
injection-regex = "usd"
file-types = ["usda"]
comment-tokens = "//"
grammar = "usd"

[[grammar]]
name = "usd"
source = { git = "https://github.com/ColinKennedy/tree-sitter-usd", rev = "4e0875f724d94d0c2ff36f9b8cb0b12f8b20d216" }

[[language]]
name = "dep"
scope = "source.dep"
injection-regex = "dep"
file-types = ["dep"]
comment-tokens = "//"
grammar = "dex"

[[language]]
name = "dex"
scope = "source.dex"
injection-regex = "dex"
file-types = ["dex"]
comment-tokens = "//"
grammar = "dex"

[[grammar]]
name = "dex"
source = { git = "https://github.com/simonomi/tree-sitter-dex", rev = "e305747488025e8882e7c85c3ce4e70ede82a70a" }
# source = { path = "/Users/simonomi/Documents/programming/tree-sitter/tree-sitter-dex" }

[[language]]
name = "swift"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "rust"
auto-format = false # rustfmt doesn't have an option to leave trailing whitespace
indent = { tab-width = 4, unit = "\t" }

[language-server.rust-analyzer.config]
check.command = "clippy"

[[language]]
name = "fish"
auto-format = false # fish_indent doesnt have a flag for using tabs
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "nu"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "typst"
indent = { tab-width = 4, unit = "\t" }

[language-server.tinymist.config]
lint = {
	enabled = true,
	when = "onType"
}
preview.background = {
	enabled = true,
	args = ["--open"],
}

[[language]]
name = "html"
auto-format = false
indent = { tab-width = 4, unit = "\t" }
language-servers = ["vscode-html-language-server", "superhtml", "codebook"]

[[language]]
name = "css"
auto-format = false
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "javascript"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "typescript"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "python"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "java"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "c"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "cpp"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "zig"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "gas" # some kind of assembly
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "toml"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "ruby"
indent = { tab-width = 4, unit = "\t" }
file-types = [
	"rb",
	"rake",
	"irb",
	"gemspec",
	"rabl",
	"jbuilder",
	"jb",
	"podspec",
	"rjs",
	"rbi",
	"rbs",
	{ glob = "rakefile" },
	{ glob = "gemfile" },
	{ glob = "Rakefile" },
	{ glob = "Gemfile" },
	{ glob = "Podfile" },
	{ glob = "Vagrantfile" },
	{ glob = "Brewfile" },
	{ glob = "brewfile" },
	{ glob = "Guardfile" },
	{ glob = "Capfile" },
	{ glob = "Cheffile" },
	{ glob = "Hobofile" },
	{ glob = "Appraisals" },
	{ glob = "Rantfile" },
	{ glob = "Berksfile" },
	{ glob = "Berksfile.lock" },
	{ glob = "Thorfile" },
	{ glob = "Puppetfile" },
	{ glob = "Fastfile" },
	{ glob = "Appfile" },
	{ glob = "Deliverfile" },
	{ glob = "Matchfile" },
	{ glob = "Scanfile" },
	{ glob = "Snapfile" },
	{ glob = "Gymfile" },
	{ glob = ".irbrc" },
]

[[language]]
name = "markdown"
indent = { tab-width = 2, unit = "\t" }
language-servers = ["marksman", "markdown-oxide", "rumdl", "codebook"]

[[language]]
name = "json"
auto-format = false
indent = { tab-width = 4, unit = "\t" }
comment-tokens = "//"
