"$schema" = "https://starship.rs/config-schema.json"

format = "${custom.directory}${custom.directory_linux}$status$character"
right_format = "$cmd_duration$git_metrics$hostname$time"

add_newline = false

[character]
format = "$symbol"
success_symbol = "[❯](bright-white)"
error_symbol = "[❯](red)"

[cmd_duration]
format = "[⏱ $duration]($style) "
style = "bright-white"
min_time = 500
show_milliseconds = true

# for if swift isn't available to compile the custom one
[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 1
fish_style_pwd_dir_length = 1

[custom.directory]
format = "$output"
shell = "/Users/simonomi/Documents/programming/swift/custom-directory-prompt/custom directory prompt"
when = true
os="macos"

[custom.directory_linux]
format = "$output"
shell = "/home/simonomi/custom-directory-prompt/custom directory prompt"
when = true
os="linux"

[git_metrics]
disabled = false

[hostname]
format = "[$ssh_symbol$hostname]($style) "
ssh_symbol = " "

[status]
format = "[\\[$status\\]]($style)"
disabled = false

[time]
format = "[$time]($style)"
time_format = "%H:%M:%S"
style = "bright-black"
disabled = false

